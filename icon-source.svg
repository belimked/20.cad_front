<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>

  <!-- DWG文件图标 (左侧) -->
  <g transform="translate(80, 120)">
    <!-- 文件外框 -->
    <path d="M 0 0 L 120 0 L 120 20 L 140 40 L 140 200 L 0 200 Z"
          fill="url(#paperGradient)" stroke="#3b82f6" stroke-width="4"/>
    <!-- 折角 -->
    <path d="M 120 0 L 120 20 L 140 20 Z" fill="#e5e7eb"/>

    <!-- CAD图纸符号 -->
    <g transform="translate(20, 60)">
      <!-- 网格线 -->
      <line x1="0" y1="20" x2="100" y2="20" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5"/>
      <line x1="0" y1="50" x2="100" y2="50" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5"/>
      <line x1="20" y1="0" x2="20" y2="80" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5"/>
      <line x1="50" y1="0" x2="50" y2="80" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5"/>
      <line x1="80" y1="0" x2="80" y2="80" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5"/>

      <!-- 图形元素 -->
      <rect x="10" y="10" width="40" height="30" fill="none" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="75" cy="25" r="15" fill="none" stroke="#3b82f6" stroke-width="3"/>
      <line x1="10" y1="60" x2="50" y2="60" stroke="#3b82f6" stroke-width="3"/>
      <line x1="60" y1="50" x2="90" y2="70" stroke="#3b82f6" stroke-width="3"/>
    </g>

    <!-- DWG 标签 -->
    <text x="70" y="180" font-family="Arial, sans-serif" font-size="24"
          font-weight="bold" fill="#3b82f6" text-anchor="middle">DWG</text>
  </g>

  <!-- 转换箭头 -->
  <g transform="translate(256, 220)">
    <path d="M -30 0 L 30 0 L 30 -15 L 50 15 L 30 45 L 30 30 L -30 30 Z"
          fill="#10b981" stroke="#059669" stroke-width="3"/>
  </g>

  <!-- PDF文件图标 (右侧) -->
  <g transform="translate(312, 120)">
    <!-- 文件外框 -->
    <path d="M 0 0 L 120 0 L 120 20 L 140 40 L 140 200 L 0 200 Z"
          fill="url(#paperGradient)" stroke="#ef4444" stroke-width="4"/>
    <!-- 折角 -->
    <path d="M 120 0 L 120 20 L 140 20 Z" fill="#e5e7eb"/>

    <!-- PDF符号 -->
    <g transform="translate(20, 60)">
      <!-- 简化的PDF文档图标 -->
      <rect x="10" y="10" width="80" height="100" rx="5" fill="none" stroke="#ef4444" stroke-width="3"/>
      <line x1="20" y1="30" x2="80" y2="30" stroke="#ef4444" stroke-width="2"/>
      <line x1="20" y1="50" x2="80" y2="50" stroke="#ef4444" stroke-width="2"/>
      <line x1="20" y1="70" x2="80" y2="70" stroke="#ef4444" stroke-width="2"/>
      <line x1="20" y1="90" x2="60" y2="90" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- PDF 标签 -->
    <text x="70" y="180" font-family="Arial, sans-serif" font-size="24"
          font-weight="bold" fill="#ef4444" text-anchor="middle">PDF</text>
  </g>
</svg>
