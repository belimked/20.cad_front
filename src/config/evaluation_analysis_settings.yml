# 评估分析配置文件
# 用于控制评估文件分析过程中的各种参数

# 分析引擎配置
analysis:
  # 大文件处理配置
  large_file_processing:
    chunk_size: 1000  # 每次处理的记录数
    memory_limit_mb: 500  # 内存使用限制（MB）
    enable_streaming: true  # 启用流式处理
    max_file_size_mb: 100  # 最大支持的文件大小（MB）
  
  # 失败模式分析配置
  failure_pattern:
    similarity_threshold: 0.8  # 相似失败的阈值
    min_pattern_count: 5  # 形成模式的最小数量
    max_examples_per_pattern: 10  # 每个模式最多保存的示例数
    enable_clustering: true  # 启用聚类分析
    
    # 失败原因分类规则
    classification_rules:
      json_mismatch:
        keywords: ["JSON属性不匹配", "值不匹配", "字段差异"]
        severity: "major"
      format_error:
        keywords: ["JSON格式无效", "JSON解析失败", "格式错误"]
        severity: "critical"
      timeout:
        keywords: ["超时", "timeout", "时间限制"]
        severity: "minor"
  
  # 质量评估配置
  quality_assessment:
    # 分数评级范围
    score_ranges:
      excellent: [90, 100]
      good: [70, 89]
      fair: [50, 69]
      poor: [0, 49]
    
    # 关键阈值
    critical_thresholds:
      min_success_rate: 0.5  # 最低成功率阈值（50%）
      max_avg_response_time: 10.0  # 最大平均响应时间（秒）
      min_json_validity: 0.95  # 最低JSON有效率（95%）
      min_perfect_score_rate: 0.1  # 最低完美分数率（10%）
    
    # 质量洞察配置
    insights:
      enable_pattern_detection: true  # 启用模式检测
      min_sample_size: 50  # 洞察分析的最小样本数
      confidence_threshold: 0.8  # 洞察置信度阈值

# 报告生成配置
reporting:
  # 图表配置
  charts:
    enable_interactive: true  # 启用交互式图表
    default_chart_type: "plotly"  # 默认图表类型
    color_scheme: "viridis"  # 颜色方案
    figure_size:
      width: 800
      height: 600
  
  # 输出配置
  output:
    formats: ["html", "json", "csv"]  # 支持的输出格式
    include_raw_data: false  # 是否包含原始数据
    compress_output: true  # 是否压缩输出
    max_report_size_mb: 50  # 最大报告大小（MB）
  
  # HTML报告配置
  html_report:
    template_path: "src/static/evaluation_reports/template.html"
    css_path: "src/static/evaluation_reports/style.css"
    js_path: "src/static/evaluation_reports/script.js"
    enable_export: true  # 启用数据导出功能

# 建议引擎配置
recommendation:
  # 建议生成配置
  generation:
    max_recommendations: 10  # 最大建议数量
    min_confidence: 0.6  # 最低置信度
    enable_prioritization: true  # 启用优先级排序
  
  # 训练指南权重分析配置
  training_guide:
    # 权重计算配置
    weight_calculation:
      failure_rate_weight: 0.6  # 失败率权重（60%）
      score_impact_weight: 0.4  # 分数影响权重（40%）
    
    # 权重分析阈值配置
    weight_thresholds:
      high_priority:
        min_weighted_score: 70.0  # 高优先级最低加权分数
        description: "需要立即关注和修复的规则"
      medium_priority:
        min_weighted_score: 40.0  # 中优先级最低加权分数
        max_weighted_score: 69.9  # 中优先级最高加权分数
        description: "需要适度关注的规则"
      low_priority:
        max_weighted_score: 39.9  # 低优先级最高加权分数
        description: "可以后续优化的规则"
    
    # 建议类型配置
    recommendation_types:
      training_focus:
        keywords: ["增强训练", "补充数据", "优化标注"]
        trigger_conditions:
          min_failure_rate: 30.0  # 失败率超过30%时建议加强训练
          min_failure_count: 5  # 失败次数超过5次时考虑
      prompt_optimization:
        keywords: ["优化提示词", "调整系统约束", "改进规则描述"]
        trigger_conditions:
          max_failure_rate: 50.0  # 失败率低于50%时优先考虑提示词优化
          min_score_impact: 20.0  # 分数影响超过20%时考虑
    
    # 样例记录配置
    sample_records:
      max_records_per_rule: 10  # 每个规则最多显示的失败记录数
      text_truncate_length: 200  # 文本字段截断长度
      include_context: true  # 是否包含上下文信息
  
  # 建议知识库
  knowledge_base:
    # JSON不匹配问题的建议
    json_mismatch:
      - title: "优化训练数据标注一致性"
        description: "检查并统一训练数据中字段值的标注格式，确保标准答案的一致性"
        priority: "high"
        category: "训练数据"
        expected_impact: "提升JSON字段匹配准确率15-25%"
        implementation_effort: "medium"
      
      - title: "增加字段值格式验证"
        description: "在训练数据生成过程中增加字段值格式的验证逻辑"
        priority: "medium"
        category: "数据验证"
        expected_impact: "减少格式不一致问题10-20%"
        implementation_effort: "low"
    
    # 格式错误问题的建议  
    format_error:
      - title: "强化JSON格式校验"
        description: "在模型输出后增加JSON格式的严格校验和自动修复机制"
        priority: "high"
        category: "模型配置"
        expected_impact: "消除95%以上的JSON格式错误"
        implementation_effort: "medium"
      
      - title: "优化模型提示词"
        description: "调整系统提示词，强调JSON格式要求和语法规范"
        priority: "medium"
        category: "提示词优化"
        expected_impact: "减少格式错误20-30%"
        implementation_effort: "low"

# 性能优化配置
performance:
  # 并行处理配置
  parallel_processing:
    enable: true
    max_workers: 4  # 最大工作线程数
    chunk_timeout: 300  # 单个块处理超时（秒）
  
  # 缓存配置
  caching:
    enable: true
    cache_dir: "cache/evaluation_analysis"
    max_cache_size_mb: 1000  # 最大缓存大小（MB）
    cache_ttl_hours: 24  # 缓存过期时间（小时）
  
  # 内存管理
  memory_management:
    gc_threshold: 0.8  # 垃圾回收阈值
    max_memory_usage_mb: 2000  # 最大内存使用（MB）
    enable_memory_monitoring: true

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "logs/evaluation_analysis.log"
  max_file_size_mb: 10
  backup_count: 5 