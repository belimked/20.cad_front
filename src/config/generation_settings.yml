# 数据生成参数配置
# 用于控制数据生成过程中的各种参数

# 变种生成参数
variation_generation:
  # 变种比例因子：当可能变种数量超过份额但不超过份额的这个倍数时，使用变种数量
  variation_ratio_factor: 1.2
  
  # 最小数据量：确保生成的数据不少于此数量
  min_data_count: 8
  
  # 远大于因子：当可能变种数量超过份额的这个倍数时，认为变种潜力远大于份额
  far_greater_factor: 2.0
  
  # 变种倍增因子：当变种潜力远大于份额时，变种数量的倍增系数
  variation_multiplier: 2.0

# 规则处理参数
rule_processing:
  # 规则最小份额：每个规则至少分配的份额
  min_rule_share: 1
  
  # 规则权重分配因子：影响根据规则权重分配份额的计算
  weight_allocation_factor: 1.0 