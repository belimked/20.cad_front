<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回答字典 - 训练数据生成系统</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Bootstrap图标 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        .loading-spinner {
            display: none;
        }
        .answer-row:hover {
            background-color: rgba(0,0,0,0.03);
            cursor: pointer;
        }
        .detail-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            margin-right: 5px;
            margin-bottom: 5px;
            background-color: #e9ecef;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .current-type-tag {
            display: inline-block;
            padding: 5px 12px;
            margin-right: 8px;
            background-color: #e7f1ff;
            border-left: 4px solid #0d6efd;
            border-radius: 5px;
            font-weight: 600;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        /* 添加固定高度列表样式 */
        .fixed-height-list {
            max-height: 600px; /* 大约显示15条数据的高度 */
            overflow-y: auto;
            border-top: 1px solid rgba(0,0,0,.125);
        }
        .list-header {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,.125);
            font-weight: bold;
            padding: 0.75rem 1.25rem;
        }
        .list-footer {
            position: sticky;
            bottom: 0;
            background-color: #f8f9fa;
            border-top: 1px solid rgba(0,0,0,.125);
            padding: 0.75rem 1.25rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/static/index.html">训练数据生成系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/static/index.html"><i class="bi bi-house-door"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/static/dictionary.html"><i class="bi bi-journal-text"></i> 字典浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/generator.html"><i class="bi bi-gear"></i> 数据生成</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/about.html"><i class="bi bi-info-circle"></i> 关于系统</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面内容 -->
    <div class="container main-container">
        <div class="row mb-4">
            <div class="col-md-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/static/index.html">首页</a></li>
                        <li class="breadcrumb-item"><a href="/static/dictionary.html">字典首页</a></li>
                        <li class="breadcrumb-item active" aria-current="page">回答字典</li>
                    </ol>
                </nav>
                <h1 class="mb-4"><i class="bi bi-chat-square-text"></i> 回答字典浏览</h1>
            </div>
        </div>

        <!-- 问题类型选择 -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-light">
                        <ul class="nav nav-tabs card-header-tabs" id="question-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="cost-questions-tab" data-bs-toggle="tab" data-bs-target="#cost-questions-pane" type="button" role="tab" aria-controls="cost-questions-pane" aria-selected="true">成本问题类型</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="vpo-questions-tab" data-bs-toggle="tab" data-bs-target="#vpo-questions-pane" type="button" role="tab" aria-controls="vpo-questions-pane" aria-selected="false">VPO问题类型</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content" id="question-tabs-content">
                            <div class="tab-pane fade show active" id="cost-questions-pane" role="tabpanel" aria-labelledby="cost-questions-tab">
                                <div class="row" id="cost-question-types-container">
                                    <!-- 成本问题类型将通过JS动态生成 -->
                                </div>
                            </div>
                            <div class="tab-pane fade" id="vpo-questions-pane" role="tabpanel" aria-labelledby="vpo-questions-tab">
                                <div class="row" id="vpo-question-types-container">
                                    <!-- VPO问题类型将通过JS动态生成 -->
                                </div>
                            </div>
                        </div>
                        <div class="text-center my-5">
                            <div class="spinner-border text-primary loading-spinner" id="question-types-loading" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索和过滤 -->
        <div class="row mb-4" id="search-section" style="display: none;">
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="搜索模板..." id="search-input">
                    <button class="btn btn-primary" type="button" id="search-button">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex justify-content-end">
                    <button class="btn btn-success" id="add-answer-btn">
                        <i class="bi bi-plus-circle"></i> 添加模板
                    </button>
                </div>
            </div>
        </div>

        <!-- 当前选中的问题类型标签 -->
        <div class="row mb-3" id="current-type-section" style="display: none;">
            <div class="col-md-12">
                <div class="d-flex align-items-center">
                    <span class="me-2">当前问题类型:</span>
                    <div class="current-type-tag" id="current-type-tag">未选择</div>
                </div>
            </div>
        </div>

        <!-- 回答模板列表 -->
        <div class="row" id="answers-section" style="display: none;">
            <div class="col-md-12">
                <div class="card">
                    <!-- 固定表头 -->
                    <div class="card-header bg-light list-header">
                        <div class="row">
                            <div class="col-md-1"><strong>#</strong></div>
                            <div class="col-md-2"><strong>ID</strong></div>
                            <div class="col-md-3"><strong>模板名称</strong></div>
                            <div class="col-md-4"><strong>描述</strong></div>
                            <div class="col-md-2"><strong>操作</strong></div>
                        </div>
                    </div>
                    <!-- 可滚动的内容区域 -->
                    <div class="card-body p-0 fixed-height-list">
                        <ul class="list-group list-group-flush" id="answers-list">
                            <!-- 回答列表将通过JS动态生成 -->
                            <li class="list-group-item text-center">
                                <div class="spinner-border text-primary loading-spinner" id="answers-loading" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <!-- 固定的页脚 -->
                    <div class="card-footer list-footer">
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-0">显示 <span id="answer-count">0</span> 个回答模板</p>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-sm btn-outline-secondary" id="load-more-btn" style="display: none;">
                                    加载更多 <i class="bi bi-chevron-down"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 回答详情区域 -->
        <div class="row mt-4" id="answer-detail-section" style="display: none;">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">回答模板详情</h5>
                    </div>
                    <div class="card-body" id="answer-detail-container">
                        <!-- 详情内容将通过JS动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑回答模态框 -->
    <div class="modal fade" id="answerModal" tabindex="-1" aria-labelledby="answerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="answerModalLabel">添加回答模板</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="answer-form">
                        <input type="hidden" id="edit-mode" value="add">
                        <input type="hidden" id="original-id" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="answer-id" class="form-label">ID</label>
                                <input type="text" class="form-control" id="answer-id" required>
                            </div>
                            <div class="col-md-6">
                                <label for="answer-name" class="form-label">名称</label>
                                <input type="text" class="form-control" id="answer-name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="answer-description" class="form-label">描述</label>
                            <textarea class="form-control" id="answer-description" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="answer-template" class="form-label">回答模板</label>
                            <textarea class="form-control" id="answer-template" rows="6" required></textarea>
                            <small class="form-text text-muted">使用 {变量名} 作为占位符，例如 {name}、{date} 等</small>
                        </div>
                        <div class="mb-3">
                            <label for="answer-variables" class="form-label">变量列表 (格式: "变量名:描述"，每行一个)</label>
                            <textarea class="form-control" id="answer-variables" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="answer-tags" class="form-label">标签 (用逗号分隔)</label>
                            <input type="text" class="form-control" id="answer-tags">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-answer-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">删除确认</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除此回答模板吗？此操作无法撤销。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加元素详情模态框 -->
    <div class="modal fade" id="answerDetailModal" tabindex="-1" aria-labelledby="answerDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="answerDetailModalLabel">回答元素详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="answer-detail-modal-container">
                    <!-- 详情内容将通过JS动态生成 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2023 训练数据生成系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- Bootstrap JS 和 Popper.js -->
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- 页面脚本 -->
    <script>
        // 全局变量
        let currentQuestionType = null;
        let currentQuestionTypeName = null;
        let currentAnswers = [];
        let displayedAnswers = []; // 新增：当前显示的答案
        let answerModalInstance = null;
        let deleteModalInstance = null;
        let answerDetailModalInstance = null; // 新增：答案详情模态框实例
        let answerToDelete = null;
        const ANSWERS_PER_PAGE = 15; // 每页显示的答案数量

        // API基础URL
        const API_BASE_URL = window.location.protocol + "//" + window.location.host;
        
        // 示例问题类型数据 (实际中将从API获取)
        const mockQuestionTypes = [
            { id: "general", name: "常规问题", description: "一般性问题的回答模板", itemCount: 15 },
            { id: "product", name: "产品问题", description: "与产品相关的问题回答", itemCount: 8 },
            { id: "service", name: "服务问题", description: "与服务相关的问题回答", itemCount: 10 },
            { id: "complaint", name: "投诉问题", description: "处理客户投诉的回答模板", itemCount: 6 }
        ];
        
        // 示例回答数据 (实际中将从API获取)
        const mockAnswers = {
            "general": [
                {
                    id: "g001",
                    name: "一般问候",
                    description: "基础问候语",
                    template: "您好，很高兴为您服务。请问有什么可以帮助您的吗？",
                    variables: [],
                    tags: ["greeting", "welcome"]
                },
                {
                    id: "g002",
                    name: "感谢反馈",
                    description: "感谢用户提供反馈",
                    template: "非常感谢您的反馈。我们将认真考虑您的意见，不断改进我们的{service}。",
                    variables: [
                        { name: "service", description: "服务名称" }
                    ],
                    tags: ["thanks", "feedback"]
                }
            ],
            "product": [
                {
                    id: "p001",
                    name: "产品介绍",
                    description: "介绍产品基本信息",
                    template: "{productName}是我们的明星产品，主要特点包括{features}。它适合{target}使用，价格为{price}元。",
                    variables: [
                        { name: "productName", description: "产品名称" },
                        { name: "features", description: "产品特点" },
                        { name: "target", description: "目标用户" },
                        { name: "price", description: "产品价格" }
                    ],
                    tags: ["product", "introduction"]
                }
            ],
            "service": [
                {
                    id: "s001",
                    name: "服务时间说明",
                    description: "解释服务提供时间",
                    template: "我们的{serviceName}服务时间为周一至周五{startTime}至{endTime}，周末{weekendService}。",
                    variables: [
                        { name: "serviceName", description: "服务名称" },
                        { name: "startTime", description: "开始时间" },
                        { name: "endTime", description: "结束时间" },
                        { name: "weekendService", description: "周末服务说明" }
                    ],
                    tags: ["service", "hours"]
                }
            ],
            "complaint": [
                {
                    id: "c001",
                    name: "投诉处理",
                    description: "回应用户投诉",
                    template: "非常抱歉给您带来不便。关于您反映的{issue}问题，我们将立即安排专人处理，预计在{timeFrame}内给您答复。您的满意是我们的首要目标。",
                    variables: [
                        { name: "issue", description: "问题描述" },
                        { name: "timeFrame", description: "处理时间" }
                    ],
                    tags: ["complaint", "apology"]
                }
            ]
        };
        
        // 文档加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化模态框
            answerModalInstance = new bootstrap.Modal(document.getElementById('answerModal'));
            deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
            answerDetailModalInstance = new bootstrap.Modal(document.getElementById('answerDetailModal')); // 初始化详情模态框
            
            // 加载问题类型列表
            loadQuestionTypes();
            
            // 搜索按钮事件
            document.getElementById('search-button').addEventListener('click', function() {
                const searchValue = document.getElementById('search-input').value.toLowerCase();
                filterAnswers(searchValue);
            });
            
            // 搜索输入框回车事件
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchValue = document.getElementById('search-input').value.toLowerCase();
                    filterAnswers(searchValue);
                }
            });
            
            // 添加回答模板按钮事件
            document.getElementById('add-answer-btn').addEventListener('click', function() {
                showAddAnswerModal();
            });
            
            // 保存回答按钮事件
            document.getElementById('save-answer-btn').addEventListener('click', function() {
                saveAnswer();
            });
            
            // 确认删除按钮事件
            document.getElementById('confirm-delete-btn').addEventListener('click', function() {
                if (answerToDelete) {
                    deleteAnswer(answerToDelete.questionType, answerToDelete.id);
                }
            });
            
            // 加载更多按钮事件
            const loadMoreBtn = document.getElementById('load-more-btn');
            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', function() {
                    loadMoreAnswers();
                });
            }
        });
        
        // 加载问题类型列表
        function loadQuestionTypes() {
            const loadingElement = document.getElementById('question-types-loading');
            if (loadingElement) {
                loadingElement.style.display = 'inline-block';
            }
            
            // 使用fetch调用API获取问题类型
            fetch(`${API_BASE_URL}/api/answer/`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络错误，无法获取问题类型列表');
                    }
                    return response.json();
                })
                .then(data => {
                    renderQuestionTypes(data);
                })
                .catch(error => {
                    console.error('获取问题类型列表出错:', error);
                    showError('获取问题类型列表失败: ' + error.message);
                    
                    // 如果API调用失败，使用模拟数据作为备用（仅用于开发测试）
                    renderQuestionTypes(mockQuestionTypes);
                })
                .finally(() => {
                    if (loadingElement) {
                        loadingElement.style.display = 'none';
                    }
                });
        }
        
        // 渲染问题类型列表
        function renderQuestionTypes(questionTypes) {
            const costContainer = document.getElementById('cost-question-types-container');
            const vpoContainer = document.getElementById('vpo-question-types-container');
            costContainer.innerHTML = '';
            vpoContainer.innerHTML = '';
            
            if (questionTypes.length === 0) {
                costContainer.innerHTML = '<div class="col-12 text-center"><p>没有可用的问题类型</p></div>';
                return;
            }

            const costTypes = questionTypes.filter(type => !type.type.includes('vpo'));
            const vpoTypes = questionTypes.filter(type => type.type.includes('vpo'));

            const renderToContainer = (container, types) => {
                 if (types.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center mt-3"><p>没有该类型的问题类型</p></div>';
                    return;
                }
                types.forEach(type => {
                    const card = document.createElement('div');
                    card.className = 'col-md-4 mb-3';
                    card.innerHTML = `
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">${type.description}</h5>
                                <p class="card-text">文件: ${type.filename}</p>
                                <button class="btn btn-primary btn-sm view-templates-btn" data-type="${type.type}" data-description="${type.description}">
                                    <i class="bi bi-eye"></i> 查看元素
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            };

            renderToContainer(costContainer, costTypes);
            renderToContainer(vpoContainer, vpoTypes);
            
            // 为所有"查看元素"按钮添加事件监听
            document.querySelectorAll('.view-templates-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const questionType = this.getAttribute('data-type');
                    const typeName = this.getAttribute('data-description');
                    loadAnswers(questionType, typeName);
                });
            });

            // 默认加载第一个"成本"类型（如果存在）
            if (costTypes.length > 0) {
                const firstType = costTypes[0];
                loadAnswers(firstType.type, firstType.description);
            } else if (vpoTypes.length > 0) {
                // 如果没有成本类型，则加载第一个VPO类型
                const firstType = vpoTypes[0];
                loadAnswers(firstType.type, firstType.description);
            }
        }
        
        // 加载指定问题类型的回答模板
        function loadAnswers(questionType, typeName) {
            currentQuestionType = questionType;
            currentQuestionTypeName = typeName || questionType;
            
            // 获取DOM元素
            const currentTypeSection = document.getElementById('current-type-section');
            const currentTypeTag = document.getElementById('current-type-tag');
            const searchSection = document.getElementById('search-section');
            const answersSection = document.getElementById('answers-section');
            const answersLoading = document.getElementById('answers-loading');
            const answersList = document.getElementById('answers-list');
            const answerDetailSection = document.getElementById('answer-detail-section');
            
            // 显示当前问题类型标签
            if (currentTypeSection) currentTypeSection.style.display = 'flex';
            if (currentTypeTag) currentTypeTag.textContent = currentQuestionTypeName;
            
            // 确保元素存在后再访问其属性
            if (searchSection) searchSection.style.display = 'flex';
            if (answersSection) answersSection.style.display = 'block';
            if (answersLoading) answersLoading.style.display = 'inline-block';
            if (answersList) answersList.innerHTML = '';
            
            // 隐藏详情区域
            if (answerDetailSection) answerDetailSection.style.display = 'none';
            
            // 使用fetch调用API获取回答元素
            const apiUrl = `${API_BASE_URL}/api/answer/${questionType}/elements`;
            console.log("调用回答元素API:", apiUrl);
            
            fetch(apiUrl)
                .then(response => {
                    console.log("回答元素API响应状态:", response.status);
                    if (!response.ok) {
                        throw new Error(`网络错误，状态码: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("成功获取回答元素数据:", data);
                    // 获取元素列表
                    currentAnswers = data.answerElements || [];
                    renderAnswers(currentAnswers);
                    if (answersLoading) answersLoading.style.display = 'none';
                })
                .catch(error => {
                    console.error('获取回答元素出错:', error);
                    showError('获取回答元素失败: ' + error.message);
                    
                    // 显示错误信息在页面上
                    if (answersList) {
                        answersList.innerHTML = `
                            <li class="list-group-item">
                                <div class="alert alert-danger mb-0">
                                    <h5><i class="bi bi-exclamation-triangle"></i> 加载回答元素失败</h5>
                                    <p>${error.message}</p>
                                    <p>请检查网络连接并<a href="javascript:location.reload()" class="alert-link">刷新页面</a>重试。</p>
                                </div>
                            </li>
                        `;
                    }
                    
                    if (answersLoading) answersLoading.style.display = 'none';
                    
                    // 如果API调用失败，使用模拟数据作为备用（仅用于开发测试）
                    if (mockAnswers[questionType]) {
                        currentAnswers = mockAnswers[questionType];
                        renderAnswers(currentAnswers);
                    }
                });
        }
        
        // 渲染回答模板列表
        function renderAnswers(answers) {
            const container = document.getElementById('answers-list');
            container.innerHTML = '';
            document.getElementById('answer-count').textContent = answers.length;
            
            if (answers.length === 0) {
                container.innerHTML = '<li class="list-group-item text-center">没有回答模板数据</li>';
                return;
            }
            
            // 存储所有答案
            currentAnswers = answers;
            
            // 显示所有答案，不使用分页
            displayedAnswers = answers;
            
            // 渲染所有答案
            renderAnswerItems(displayedAnswers);
            
            // 隐藏"加载更多"按钮
            const loadMoreBtn = document.getElementById('load-more-btn');
            if (loadMoreBtn) {
                loadMoreBtn.style.display = 'none';
            }
        }
        
        // 渲染答案项
        function renderAnswerItems(answers) {
            const container = document.getElementById('answers-list');
            
            answers.forEach((answer, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'list-group-item answer-row';
                
                // 获取描述信息
                let description = '';
                if (answer.relateToBase && answer.relateToBase !== '无') {
                    description = `关联基础元素: ${answer.relateToBase}`;
                } else if (answer.isStatic === '是' && answer.staticValue) {
                    description = `静态值: ${answer.staticValue}`;
                }
                
                listItem.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-1">${index + 1}</div>
                        <div class="col-md-2">${answer.name || ''}</div>
                        <div class="col-md-3">${answer.nameCN || ''}</div>
                        <div class="col-md-4">${description}</div>
                        <div class="col-md-2">
                            <button class="btn btn-sm btn-outline-info me-1 view-detail-btn" title="查看详情"><i class="bi bi-eye"></i></button>
                            <button class="btn btn-sm btn-outline-primary me-1 edit-answer-btn" title="编辑"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-answer-btn" title="删除"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `;
                
                // 添加点击事件
                listItem.addEventListener('click', function(e) {
                    if (!e.target.closest('button')) {
                        showAnswerDetail(answer);
                    }
                });
                
                // 添加查看按钮点击事件
                const viewBtn = listItem.querySelector('.view-detail-btn');
                viewBtn.addEventListener('click', function() {
                    showAnswerDetail(answer);
                });
                
                // 添加编辑按钮点击事件
                const editBtn = listItem.querySelector('.edit-answer-btn');
                editBtn.addEventListener('click', function() {
                    showEditAnswerModal(answer);
                });
                
                // 添加删除按钮点击事件
                const deleteBtn = listItem.querySelector('.delete-answer-btn');
                deleteBtn.addEventListener('click', function() {
                    showDeleteConfirm(currentQuestionType, answer.name);
                });
                
                container.appendChild(listItem);
            });
        }
        
        // 显示回答详情
        function showAnswerDetail(answer) {
            const container = document.getElementById('answer-detail-modal-container');
            
            let relateToBaseInfo = '';
            if (answer.relateToBase && answer.relateToBase !== '无') {
                relateToBaseInfo = `
                <div class="mb-3">
                    <h6>关联基础元素:</h6>
                    <p>${answer.relateToBase}</p>
                </div>`;
            }
            
            let staticValueInfo = '';
            if (answer.isStatic === '是' && answer.staticValue) {
                staticValueInfo = `
                <div class="mb-3">
                    <h6>静态值:</h6>
                    <p>${answer.staticValue}</p>
                </div>`;
            }
            
            container.innerHTML = `
                <div class="detail-card">
                    <h4>${answer.nameCN || '未命名'} <span class="badge bg-secondary">${answer.name || ''}</span></h4>
                    
                    <div class="mb-3">
                        <h6>是否静态:</h6>
                        <p>${answer.isStatic || '否'}</p>
                    </div>
                    
                    ${relateToBaseInfo}
                    ${staticValueInfo}
                </div>
            `;
            
            // 设置模态框标题
            document.getElementById('answerDetailModalLabel').textContent = `回答元素详情: ${answer.nameCN || '未命名'}`;
            
            // 显示模态框
            answerDetailModalInstance.show();
        }
        
        // 过滤回答模板
        function filterAnswers(searchValue) {
            if (!searchValue) {
                renderAnswers(currentAnswers);
                return;
            }
            
            const filtered = currentAnswers.filter(answer => {
                return (
                    (answer.name && answer.name.toLowerCase().includes(searchValue)) || 
                    (answer.nameCN && answer.nameCN.toLowerCase().includes(searchValue)) ||
                    (answer.relateToBase && answer.relateToBase.toLowerCase().includes(searchValue)) ||
                    (answer.staticValue && answer.staticValue.toLowerCase().includes(searchValue))
                );
            });
            
            renderAnswers(filtered);
        }
        
        // 显示添加回答模态框
        function showAddAnswerModal() {
            if (!currentQuestionType) {
                showError('请先选择一个问题类型');
                return;
            }
            
            document.getElementById('answerModalLabel').textContent = '添加回答元素';
            document.getElementById('edit-mode').value = 'add';
            document.getElementById('original-id').value = '';
            
            // 清空表单
            document.getElementById('answer-form').reset();
            
            // 默认值
            document.getElementById('answer-id').value = '';
            document.getElementById('answer-name').value = '';
            document.getElementById('answer-description').value = '';
            document.getElementById('answer-template').value = '';
            document.getElementById('answer-variables').value = '';
            document.getElementById('answer-tags').value = '';
            
            // 显示模态框
            answerModalInstance.show();
        }
        
        // 显示编辑回答模态框
        function showEditAnswerModal(answer) {
            document.getElementById('answerModalLabel').textContent = '编辑回答元素';
            document.getElementById('edit-mode').value = 'edit';
            document.getElementById('original-id').value = answer.name;
            
            // 填充表单
            document.getElementById('answer-id').value = answer.name || '';
            document.getElementById('answer-name').value = answer.nameCN || '';
            
            // 设置描述
            let description = '';
            if (answer.isStatic === '是') {
                description = '静态元素';
            } else {
                description = '动态元素';
            }
            document.getElementById('answer-description').value = description;
            
            // 设置模板内容（使用关联基础元素或静态值）
            let template = '';
            if (answer.relateToBase && answer.relateToBase !== '无') {
                template = `关联基础元素: ${answer.relateToBase}`;
            } else if (answer.isStatic === '是' && answer.staticValue) {
                template = `静态值: ${answer.staticValue}`;
            }
            document.getElementById('answer-template').value = template;
            
            // 变量列表（这里可以是空的，因为answerElements结构与模拟数据不完全一致）
            document.getElementById('answer-variables').value = '';
            
            // 标签（这里可以是isStatic值）
            document.getElementById('answer-tags').value = answer.isStatic || '否';
            
            // 显示模态框
            answerModalInstance.show();
        }
        
        // 保存回答
        function saveAnswer() {
            if (!currentQuestionType) {
                showError('请先选择一个问题类型');
                return;
            }
            
            // 获取表单数据
            const editMode = document.getElementById('edit-mode').value;
            const originalId = document.getElementById('original-id').value;
            const id = document.getElementById('answer-id').value;
            const name = document.getElementById('answer-name').value;
            const description = document.getElementById('answer-description').value;
            const template = document.getElementById('answer-template').value;
            const variablesText = document.getElementById('answer-variables').value;
            const tagsText = document.getElementById('answer-tags').value;
            
            // 验证必填字段
            if (!id || !name) {
                showError('ID和名称为必填字段');
                return;
            }
            
            // 构建回答数据
            // 注意：这里我们需要适配API接受的格式，与我们的表单数据可能有差异
            const answerData = {
                name: id,
                nameCN: name,
                isStatic: tagsText || '否',
                relateToBase: '无',
                staticValue: '无'
            };
            
            // 根据模板内容解析关联基础元素或静态值
            if (template.startsWith('关联基础元素:')) {
                answerData.relateToBase = template.replace('关联基础元素:', '').trim();
                answerData.isStatic = '否';
            } else if (template.startsWith('静态值:')) {
                answerData.staticValue = template.replace('静态值:', '').trim();
                answerData.isStatic = '是';
            }
            
            // 发送请求更新当前加载的回答元素
            fetch(`${API_BASE_URL}/api/answer/${currentQuestionType}/elements`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络错误，无法获取回答元素');
                    }
                    return response.json();
                })
                .then(data => {
                    // 克隆当前的回答元素列表
                    const answerElements = [...(data.answerElements || [])];
                    
                    if (editMode === 'add') {
                        // 添加新元素
                        answerElements.push(answerData);
                    } else {
                        // 更新现有元素
                        const index = answerElements.findIndex(a => a.name === originalId);
                        if (index !== -1) {
                            answerElements[index] = answerData;
                        } else {
                            answerElements.push(answerData);
                        }
                    }
                    
                    // 更新元素文件
                    const updatedData = { 
                        answerObject: currentQuestionType,
                        answerElements: answerElements 
                    };
                    
                    return fetch(`${API_BASE_URL}/api/answer/${currentQuestionType}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updatedData)
                    });
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.detail || '保存回答元素失败'); });
                    }
                    return response.json();
                })
                .then(result => {
                    showSuccess(editMode === 'add' ? '回答元素添加成功' : '回答元素更新成功');
                    
                    // 隐藏模态框
                    answerModalInstance.hide();
                    
                    // 重新加载回答列表
                    loadAnswers(currentQuestionType, currentQuestionTypeName);
                })
                .catch(error => {
                    console.error('保存回答元素出错:', error);
                    showError('保存回答元素失败: ' + error.message);
                    
                    // 如果API调用失败，使用模拟操作（仅用于开发测试）
                    if (mockAnswers[currentQuestionType]) {
                        if (editMode === 'add') {
                            // 模拟添加
                            mockAnswers[currentQuestionType].push(answerData);
                            showSuccess('回答元素添加成功（模拟）');
                        } else {
                            // 模拟更新
                            const index = mockAnswers[currentQuestionType].findIndex(a => a.id === originalId);
                            if (index !== -1) {
                                mockAnswers[currentQuestionType][index] = answerData;
                                showSuccess('回答元素更新成功（模拟）');
                            } else {
                                showError('未找到要更新的回答元素');
                            }
                        }
                        
                        // 重新加载回答列表
                        loadAnswers(currentQuestionType);
                        
                        // 隐藏模态框
                        answerModalInstance.hide();
                    }
                });
        }
        
        // 显示删除确认
        function showDeleteConfirm(questionType, answerId) {
            answerToDelete = { questionType, id: answerId };
            deleteModalInstance.show();
        }
        
        // 删除回答
        function deleteAnswer(questionType, answerId) {
            // 发送请求更新当前加载的回答元素
            fetch(`${API_BASE_URL}/api/answer/${currentQuestionType}/elements`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络错误，无法获取回答元素');
                    }
                    return response.json();
                })
                .then(data => {
                    // 克隆当前的回答元素列表
                    const answerElements = [...(data.answerElements || [])];
                    
                    // 找到要删除的元素的索引
                    const index = answerElements.findIndex(a => a.name === answerId);
                    if (index === -1) {
                        throw new Error('未找到要删除的回答元素');
                    }
                    
                    // 删除元素
                    answerElements.splice(index, 1);
                    
                    // 更新元素文件
                    const updatedData = { 
                        answerObject: currentQuestionType,
                        answerElements: answerElements 
                    };
                    
                    return fetch(`${API_BASE_URL}/api/answer/${currentQuestionType}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updatedData)
                    });
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.detail || '删除回答元素失败'); });
                    }
                    return response.json();
                })
                .then(result => {
                    showSuccess('回答元素删除成功');
                    
                    // 隐藏删除确认模态框
                    deleteModalInstance.hide();
                    
                    // 重新加载回答列表
                    loadAnswers(currentQuestionType, currentQuestionTypeName);
                    
                    // 隐藏详情区域
                    document.getElementById('answer-detail-section').style.display = 'none';
                })
                .catch(error => {
                    console.error('删除回答元素出错:', error);
                    showError('删除回答元素失败: ' + error.message);
                    
                    // 如果API调用失败，使用模拟操作（仅用于开发测试）
                    if (mockAnswers[questionType]) {
                        // 模拟删除操作
                        const index = mockAnswers[questionType].findIndex(a => a.id === answerId);
                        if (index !== -1) {
                            mockAnswers[questionType].splice(index, 1);
                            showSuccess('回答元素删除成功（模拟）');
                            
                            // 隐藏删除确认模态框
                            deleteModalInstance.hide();
                            
                            // 重新加载回答列表
                            loadAnswers(questionType);
                            
                            // 隐藏详情区域
                            document.getElementById('answer-detail-section').style.display = 'none';
                        } else {
                            showError('未找到要删除的回答元素');
                            deleteModalInstance.hide();
                        }
                    } else {
                        deleteModalInstance.hide();
                    }
                });
        }
        
        // 显示成功消息
        function showSuccess(message) {
            // 创建消息元素
            const alertEl = document.createElement('div');
            alertEl.className = 'alert alert-success alert-dismissible position-fixed top-0 end-0 m-3';
            alertEl.setAttribute('role', 'alert');
            alertEl.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.body.appendChild(alertEl);
            
            // 3秒后自动关闭
            setTimeout(() => {
                alertEl.remove();
            }, 3000);
        }
        
        // 显示错误消息
        function showError(message) {
            // 创建消息元素
            const alertEl = document.createElement('div');
            alertEl.className = 'alert alert-danger alert-dismissible position-fixed top-0 end-0 m-3';
            alertEl.setAttribute('role', 'alert');
            alertEl.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.body.appendChild(alertEl);
            
            // 3秒后自动关闭
            setTimeout(() => {
                alertEl.remove();
            }, 3000);
        }
    </script>
</body>
