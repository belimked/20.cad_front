<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础字典 - 训练数据生成系统</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Bootstrap图标 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        .loading-spinner {
            display: none;
        }
        .element-row:hover {
            background-color: rgba(0,0,0,0.03);
            cursor: pointer;
        }
        .detail-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            margin-right: 5px;
            margin-bottom: 5px;
            background-color: #e9ecef;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .current-object-tag {
            display: inline-block;
            padding: 5px 12px;
            margin-right: 8px;
            background-color: #e7f1ff;
            border-left: 4px solid #0d6efd;
            border-radius: 5px;
            font-weight: 600;
        }
        /* 添加固定高度列表样式 */
        .fixed-height-list {
            max-height: 600px; /* 大约显示15条数据的高度 */
            overflow-y: auto;
            border-top: 1px solid rgba(0,0,0,.125);
        }
        .list-header {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,.125);
            font-weight: bold;
            padding: 0.75rem 1.25rem;
        }
        .list-footer {
            position: sticky;
            bottom: 0;
            background-color: #f8f9fa;
            border-top: 1px solid rgba(0,0,0,.125);
            padding: 0.75rem 1.25rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/static/index.html">训练数据生成系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/static/index.html"><i class="bi bi-house-door"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/static/dictionary.html"><i class="bi bi-journal-text"></i> 字典浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/generator.html"><i class="bi bi-gear"></i> 数据生成</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/about.html"><i class="bi bi-info-circle"></i> 关于系统</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面内容 -->
    <div class="container main-container">
        <div class="row mb-4">
            <div class="col-md-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/static/index.html">首页</a></li>
                        <li class="breadcrumb-item active" aria-current="page">基础字典</li>
                    </ol>
                </nav>
                <h1 class="mb-4"><i class="bi bi-book"></i> 基础字典浏览</h1>
            </div>
        </div>

        <!-- 业务对象选择 -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">基础元素业务对象</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="business-objects-container">
                            <!-- 业务对象卡片将通过JS动态生成 -->
                            <div class="text-center my-5">
                                <div class="spinner-border text-primary loading-spinner" id="business-objects-loading" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索和过滤 -->
        <div class="row mb-4" id="search-section" style="display: none;">
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="搜索元素..." id="search-input">
                    <button class="btn btn-primary" type="button" id="search-button">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex justify-content-end">
                    <button class="btn btn-success" id="add-element-btn">
                        <i class="bi bi-plus-circle"></i> 添加元素
                    </button>
                </div>
            </div>
        </div>

        <!-- 当前选中的业务对象标签 -->
        <div class="row mb-3" id="current-object-section" style="display: none;">
            <div class="col-md-12">
                <div class="d-flex align-items-center">
                    <span class="me-2">当前业务对象:</span>
                    <div class="current-object-tag" id="current-object-tag">未选择</div>
                </div>
            </div>
        </div>

        <!-- 元素列表 -->
        <div class="row" id="elements-section" style="display: none;">
            <div class="col-md-12">
                <div class="card">
                    <!-- 固定表头 -->
                    <div class="card-header bg-light list-header">
                        <div class="row">
                            <div class="col-md-1"><strong>#</strong></div>
                            <div class="col-md-2"><strong>编号</strong></div>
                            <div class="col-md-3"><strong>名称</strong></div>
                            <div class="col-md-4"><strong>描述</strong></div>
                            <div class="col-md-2"><strong>操作</strong></div>
                        </div>
                    </div>
                    <!-- 可滚动的内容区域 -->
                    <div class="card-body p-0 fixed-height-list">
                        <ul class="list-group list-group-flush" id="elements-list">
                            <!-- 元素列表将通过JS动态生成 -->
                            <li class="list-group-item text-center">
                                <div class="spinner-border text-primary loading-spinner" id="elements-loading" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <!-- 固定的页脚 -->
                    <div class="card-footer list-footer">
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-0">显示 <span id="element-count">0</span> 个元素</p>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-sm btn-outline-secondary" id="load-more-btn" style="display: none;">
                                    加载更多 <i class="bi bi-chevron-down"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加元素详情模态框 -->
    <div class="modal fade" id="elementDetailModal" tabindex="-1" aria-labelledby="elementDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="elementDetailModalLabel">元素详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="element-detail-container">
                    <!-- 详情内容将通过JS动态生成 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑元素模态框 -->
    <div class="modal fade" id="elementModal" tabindex="-1" aria-labelledby="elementModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="elementModalLabel">添加元素</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="element-form">
                        <input type="hidden" id="edit-mode" value="add">
                        <input type="hidden" id="original-number" value="">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="element-number" class="form-label">编号</label>
                                <input type="text" class="form-control" id="element-number" required>
                            </div>
                            <div class="col-md-6">
                                <label for="element-name" class="form-label">名称</label>
                                <input type="text" class="form-control" id="element-name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="element-conditions" class="form-label">条件列表 (每行一个)</label>
                            <textarea class="form-control" id="element-conditions" rows="4" required></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label for="element-original-text" class="form-label">原始文本</label>
                                <input type="text" class="form-control" id="element-original-text">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="element-original-logic" class="form-label">原始逻辑</label>
                                <input type="text" class="form-control" id="element-original-logic">
                            </div>
                            <div class="col-md-6">
                                <label for="element-original-regex" class="form-label">原始正则</label>
                                <input type="text" class="form-control" id="element-original-regex">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="element-dictlist" class="form-label">字典列表 (格式: "编号:字典名"，用逗号分隔)</label>
                            <input type="text" class="form-control" id="element-dictlist">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-element-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">删除确认</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除此元素吗？此操作无法撤销。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2023 训练数据生成系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- Bootstrap JS 和 Popper.js -->
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- 页面脚本 -->
    <script>
        // 全局变量
        let currentBusinessObject = null;
        let currentBusinessObjectName = null; // 新增变量：用于存储当前业务对象名称
        let currentElements = [];
        let displayedElements = []; // 新增：当前显示的元素
        let elementModalInstance = null;
        let deleteModalInstance = null;
        let elementDetailModalInstance = null; // 新增变量：元素详情模态框实例
        let elementToDelete = null;
        const ELEMENTS_PER_PAGE = 15; // 每页显示的元素数量

        // API基础URL
        const API_BASE_URL = window.location.protocol + "//" + window.location.host;
        
        // 文档加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化模态框
            elementModalInstance = new bootstrap.Modal(document.getElementById('elementModal'));
            deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
            elementDetailModalInstance = new bootstrap.Modal(document.getElementById('elementDetailModal')); // 初始化元素详情模态框
            
            // 加载业务对象列表
            loadBusinessObjects();
            
            // 搜索按钮事件
            document.getElementById('search-button').addEventListener('click', function() {
                const searchValue = document.getElementById('search-input').value.toLowerCase();
                filterElements(searchValue);
            });
            
            // 搜索输入框回车事件
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchValue = document.getElementById('search-input').value.toLowerCase();
                    filterElements(searchValue);
                }
            });
            
            // 添加元素按钮事件
            document.getElementById('add-element-btn').addEventListener('click', function() {
                showAddElementModal();
            });
            
            // 保存元素按钮事件
            document.getElementById('save-element-btn').addEventListener('click', function() {
                saveElement();
            });
            
            // 确认删除按钮事件
            document.getElementById('confirm-delete-btn').addEventListener('click', function() {
                if (elementToDelete) {
                    deleteElement(elementToDelete.businessObject, elementToDelete.number);
                }
            });
            
            // 加载更多按钮事件
            const loadMoreBtn = document.getElementById('load-more-btn');
            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', function() {
                    loadMoreElements();
                });
            }
        });
        
        // 加载业务对象列表
        function loadBusinessObjects() {
            const loadingElement = document.getElementById('business-objects-loading');
            if (loadingElement) {
                loadingElement.style.display = 'inline-block';
            }
            
            fetch(`${API_BASE_URL}/api/dict/base/`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络错误，无法获取业务对象列表');
                    }
                    return response.json();
                })
                .then(data => {
                    renderBusinessObjects(data);
                })
                .catch(error => {
                    console.error('获取业务对象列表出错:', error);
                    showError('获取业务对象列表失败: ' + error.message);
                })
                .finally(() => {
                    const loadingElement = document.getElementById('business-objects-loading');
                    if (loadingElement) {
                        loadingElement.style.display = 'none';
                    }
                });
        }
        
        // 渲染业务对象列表
        function renderBusinessObjects(businessObjects) {
            const container = document.getElementById('business-objects-container');
            container.innerHTML = '';
            
            if (businessObjects.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p>没有可用的业务对象</p></div>';
                return;
            }
            
            businessObjects.forEach(obj => {
                const card = document.createElement('div');
                card.className = 'col-md-4 mb-3';
                card.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${obj.description}</h5>
                            <p class="card-text">元素数量: <span class="element-count" data-object="${obj.mainObject}">0</span></p>
                            <p class="card-text"><small class="text-muted">文件: ${obj.filename}</small></p>
                            <button class="btn btn-primary btn-sm view-elements-btn" data-object="${obj.mainObject}" data-description="${obj.description}">
                                <i class="bi bi-eye"></i> 查看元素
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
                
                // 获取实际元素数量
                fetchElementCount(obj.mainObject);
            });
            
            // 为所有"查看元素"按钮添加事件监听
            document.querySelectorAll('.view-elements-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const businessObject = this.getAttribute('data-object');
                    const description = this.getAttribute('data-description');
                    loadElements(businessObject, description);
                });
            });
        }
        
        // 获取业务对象的实际元素数量
        function fetchElementCount(businessObject) {
            fetch(`${API_BASE_URL}/api/dict/base/${businessObject}/elements`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('无法获取元素数量');
                    }
                    return response.json();
                })
                .then(elements => {
                    // 更新对应业务对象卡片中的元素数量
                    const countElement = document.querySelector(`.element-count[data-object="${businessObject}"]`);
                    if (countElement) {
                        countElement.textContent = elements.length;
                    }
                })
                .catch(error => {
                    console.error(`获取${businessObject}元素数量出错:`, error);
                });
        }
        
        // 加载指定业务对象的元素列表
        function loadElements(businessObject, description) {
            currentBusinessObject = businessObject;
            currentBusinessObjectName = description || businessObject;
            
            // 显示当前业务对象标签
            const currentObjectSection = document.getElementById('current-object-section');
            const currentObjectTag = document.getElementById('current-object-tag');
            const searchSection = document.getElementById('search-section');
            const elementsSection = document.getElementById('elements-section');
            const elementsLoading = document.getElementById('elements-loading');
            const elementsList = document.getElementById('elements-list');
            
            // 确保元素存在后再访问其属性
            if (currentObjectSection) currentObjectSection.style.display = 'flex';
            if (currentObjectTag) currentObjectTag.textContent = currentBusinessObjectName;
            if (searchSection) searchSection.style.display = 'flex';
            if (elementsSection) elementsSection.style.display = 'block';
            if (elementsLoading) elementsLoading.style.display = 'inline-block';
            if (elementsList) elementsList.innerHTML = '';
            
            fetch(`${API_BASE_URL}/api/dict/base/${businessObject}/elements`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络错误，无法获取元素列表');
                    }
                    return response.json();
                })
                .then(elements => {
                    currentElements = elements;
                    
                    // 更新业务对象卡片中的元素数量，确保与实际加载的数量一致
                    const countElement = document.querySelector(`.element-count[data-object="${businessObject}"]`);
                    if (countElement) {
                        countElement.textContent = elements.length;
                    }
                    
                    renderElements(elements);
                })
                .catch(error => {
                    console.error('获取元素列表出错:', error);
                    showError('获取元素列表失败: ' + error.message);
                })
                .finally(() => {
                    // 确保元素存在后再修改其样式
                    if (elementsLoading) elementsLoading.style.display = 'none';
                });
        }
        
        // 渲染元素列表
        function renderElements(elements) {
            const container = document.getElementById('elements-list');
            container.innerHTML = '';
            document.getElementById('element-count').textContent = elements.length;
            
            if (elements.length === 0) {
                container.innerHTML = '<li class="list-group-item text-center">没有元素数据</li>';
                return;
            }
            
            // 存储所有元素
            currentElements = elements;
            
            // 初始只显示前15个元素
            displayedElements = elements.slice(0, ELEMENTS_PER_PAGE);
            
            // 渲染初始显示的元素
            renderElementItems(displayedElements);
            
            // 显示或隐藏"加载更多"按钮
            const loadMoreBtn = document.getElementById('load-more-btn');
            if (loadMoreBtn) {
                if (elements.length > ELEMENTS_PER_PAGE) {
                    loadMoreBtn.style.display = 'inline-block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            }
        }
        
        // 渲染元素项
        function renderElementItems(elements) {
            const container = document.getElementById('elements-list');
            
            elements.forEach((element, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'list-group-item element-row';
                listItem.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-1">${index + 1}</div>
                        <div class="col-md-2">${element.number || ''}</div>
                        <div class="col-md-3">${element.name || ''}</div>
                        <div class="col-md-4">${getDescription(element)}</div>
                        <div class="col-md-2">
                            <button class="btn btn-sm btn-outline-info me-1 view-detail-btn" title="查看详情"><i class="bi bi-eye"></i></button>
                            <button class="btn btn-sm btn-outline-primary me-1 edit-element-btn" title="编辑"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-element-btn" title="删除"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `;
                
                // 添加点击事件
                listItem.addEventListener('click', function(e) {
                    if (!e.target.closest('button')) {
                        showElementDetail(element);
                    }
                });
                
                // 添加查看按钮点击事件
                const viewBtn = listItem.querySelector('.view-detail-btn');
                viewBtn.addEventListener('click', function() {
                    showElementDetail(element);
                });
                
                // 添加编辑按钮点击事件
                const editBtn = listItem.querySelector('.edit-element-btn');
                editBtn.addEventListener('click', function() {
                    showEditElementModal(element);
                });
                
                // 添加删除按钮点击事件
                const deleteBtn = listItem.querySelector('.delete-element-btn');
                deleteBtn.addEventListener('click', function() {
                    showDeleteConfirm(currentBusinessObject, element.number);
                });
                
                container.appendChild(listItem);
            });
        }
        
        // 获取元素描述
        function getDescription(element) {
            if (element.conditionList && element.conditionList.length > 0) {
                return element.conditionList[0] + (element.conditionList.length > 1 ? ` 等${element.conditionList.length}项` : '');
            }
            return element.originalText || '';
        }
        
        // 显示元素详情
        function showElementDetail(element) {
            const container = document.getElementById('element-detail-container');
            
            container.innerHTML = `
                <div class="detail-card">
                    <h4>${element.name || '未命名'} <span class="badge bg-secondary">${element.number || ''}</span></h4>
                    
                    ${element.originalText ? `
                    <div class="mb-3">
                        <h6>原始文本:</h6>
                        <p>${element.originalText}</p>
                    </div>
                    ` : ''}
                    
                    ${element.conditionList && element.conditionList.length > 0 ? `
                    <div class="mb-3">
                        <h6>条件列表:</h6>
                        <ul>
                            ${element.conditionList.map(condition => `<li>${condition}</li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}
                    
                    <div class="row">
                        ${element.originalLogic ? `
                        <div class="col-md-6 mb-3">
                            <h6>原始逻辑:</h6>
                            <p>${element.originalLogic}</p>
                        </div>
                        ` : ''}
                        
                        ${element.originalRegex ? `
                        <div class="col-md-6 mb-3">
                            <h6>原始正则:</h6>
                            <p><code>${element.originalRegex}</code></p>
                        </div>
                        ` : ''}
                    </div>
                    
                    ${element.dictlist && element.dictlist.length > 0 ? `
                    <div class="mb-3">
                        <h6>字典列表:</h6>
                        <div>
                            ${element.dictlist.map(dict => `<span class="tag">${dict}</span>`).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            
            // 设置模态框标题
            document.getElementById('elementDetailModalLabel').textContent = `元素详情: ${element.name || '未命名'}`;
            
            // 显示模态框
            elementDetailModalInstance.show();
        }
        
        // 过滤元素
        function filterElements(searchValue) {
            if (!searchValue) {
                renderElements(currentElements);
                return;
            }
            
            const filtered = currentElements.filter(element => {
                return (
                    (element.name && element.name.toLowerCase().includes(searchValue)) || 
                    (element.number && element.number.toLowerCase().includes(searchValue)) ||
                    (element.originalText && element.originalText.toLowerCase().includes(searchValue)) ||
                    (element.conditionList && element.conditionList.some(cond => cond.toLowerCase().includes(searchValue)))
                );
            });
            
            renderElements(filtered);
        }
        
        // 显示添加元素模态框
        function showAddElementModal() {
            if (!currentBusinessObject) {
                showError('请先选择一个业务对象');
                return;
            }
            
            document.getElementById('elementModalLabel').textContent = '添加元素';
            document.getElementById('edit-mode').value = 'add';
            document.getElementById('original-number').value = '';
            
            // 清空表单
            document.getElementById('element-form').reset();
            
            // 生成新编号 (根据当前最大编号 + 1)
            let maxNumber = 0;
            currentElements.forEach(element => {
                const num = parseInt(element.number);
                if (!isNaN(num) && num > maxNumber) {
                    maxNumber = num;
                }
            });
            
            const nextNumber = (maxNumber + 1).toString().padStart(2, '0');
            document.getElementById('element-number').value = nextNumber;
            
            // 显示模态框
            elementModalInstance.show();
        }
        
        // 显示编辑元素模态框
        function showEditElementModal(element) {
            document.getElementById('elementModalLabel').textContent = '编辑元素';
            document.getElementById('edit-mode').value = 'edit';
            document.getElementById('original-number').value = element.number;
            
            // 填充表单
            document.getElementById('element-number').value = element.number || '';
            document.getElementById('element-name').value = element.name || '';
            document.getElementById('element-original-text').value = element.originalText || '';
            document.getElementById('element-original-logic').value = element.originalLogic || '';
            document.getElementById('element-original-regex').value = element.originalRegex || '';
            
            // 条件列表
            document.getElementById('element-conditions').value = 
                element.conditionList && element.conditionList.length > 0 
                ? element.conditionList.join('\n') 
                : '';
            
            // 字典列表
            document.getElementById('element-dictlist').value = 
                element.dictlist && element.dictlist.length > 0 
                ? element.dictlist.join(', ') 
                : '';
            
            // 显示模态框
            elementModalInstance.show();
        }
        
        // 保存元素
        function saveElement() {
            if (!currentBusinessObject) {
                showError('请先选择一个业务对象');
                return;
            }
            
            // 获取表单数据
            const editMode = document.getElementById('edit-mode').value;
            const originalNumber = document.getElementById('original-number').value;
            const number = document.getElementById('element-number').value;
            const name = document.getElementById('element-name').value;
            const conditions = document.getElementById('element-conditions').value;
            const originalText = document.getElementById('element-original-text').value;
            const originalLogic = document.getElementById('element-original-logic').value;
            const originalRegex = document.getElementById('element-original-regex').value;
            const dictlistStr = document.getElementById('element-dictlist').value;
            
            // 验证必填字段
            if (!number || !name) {
                showError('编号和名称为必填字段');
                return;
            }
            
            // 构建元素数据
            const elementData = {
                number: number,
                name: name,
                conditionList: conditions.split('\n').filter(line => line.trim() !== ''),
                originalText: originalText,
                originalLogic: originalLogic,
                originalRegex: originalRegex,
                dictlist: dictlistStr ? dictlistStr.split(',').map(item => item.trim()) : []
            };
            
            // 根据模式决定操作
            if (editMode === 'add') {
                addElement(currentBusinessObject, elementData);
            } else {
                updateElement(currentBusinessObject, originalNumber, elementData);
            }
            
            // 隐藏模态框
            elementModalInstance.hide();
        }
        
        // 添加元素
        function addElement(businessObject, elementData) {
            fetch(`${API_BASE_URL}/api/dict/base/${businessObject}/elements`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(elementData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.detail || '添加元素失败'); });
                }
                return response.json();
            })
            .then(result => {
                showSuccess('元素添加成功');
                // 重新加载元素列表
                loadElements(businessObject);
            })
            .catch(error => {
                console.error('添加元素出错:', error);
                showError('添加元素失败: ' + error.message);
            });
        }
        
        // 更新元素
        function updateElement(businessObject, elementNumber, elementData) {
            fetch(`${API_BASE_URL}/api/dict/base/${businessObject}/elements/${elementNumber}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(elementData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.detail || '更新元素失败'); });
                }
                return response.json();
            })
            .then(result => {
                showSuccess('元素更新成功');
                // 重新加载元素列表
                loadElements(businessObject);
            })
            .catch(error => {
                console.error('更新元素出错:', error);
                showError('更新元素失败: ' + error.message);
            });
        }
        
        // 显示删除确认
        function showDeleteConfirm(businessObject, elementNumber) {
            elementToDelete = { businessObject, number: elementNumber };
            deleteModalInstance.show();
        }
        
        // 删除元素
        function deleteElement(businessObject, elementNumber) {
            fetch(`${API_BASE_URL}/api/dict/base/${businessObject}/elements/${elementNumber}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.detail || '删除元素失败'); });
                }
                return response.json();
            })
            .then(result => {
                showSuccess('元素删除成功');
                // 隐藏删除确认模态框
                deleteModalInstance.hide();
                // 重新加载元素列表
                loadElements(businessObject);
            })
            .catch(error => {
                console.error('删除元素出错:', error);
                showError('删除元素失败: ' + error.message);
                // 隐藏删除确认模态框
                deleteModalInstance.hide();
            });
        }
        
        // 显示成功消息
        function showSuccess(message) {
            // 创建消息元素
            const alertEl = document.createElement('div');
            alertEl.className = 'alert alert-success alert-dismissible position-fixed top-0 end-0 m-3';
            alertEl.setAttribute('role', 'alert');
            alertEl.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.body.appendChild(alertEl);
            
            // 3秒后自动关闭
            setTimeout(() => {
                alertEl.remove();
            }, 3000);
        }
        
        // 显示错误消息
        function showError(message) {
            // 创建消息元素
            const alertEl = document.createElement('div');
            alertEl.className = 'alert alert-danger alert-dismissible position-fixed top-0 end-0 m-3';
            alertEl.setAttribute('role', 'alert');
            alertEl.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.body.appendChild(alertEl);
            
            // 3秒后自动关闭
            setTimeout(() => {
                alertEl.remove();
            }, 3000);
        }
        
        // 加载更多元素
        function loadMoreElements() {
            // 当前已显示的元素数量
            const currentDisplayCount = displayedElements.length;
            
            // 如果已经显示了所有元素，直接返回
            if (currentDisplayCount >= currentElements.length) {
                return;
            }
            
            // 计算需要额外加载的元素
            const additionalElements = currentElements.slice(
                currentDisplayCount, 
                currentDisplayCount + ELEMENTS_PER_PAGE
            );
            
            // 添加到已显示元素列表
            displayedElements = [...displayedElements, ...additionalElements];
            
            // 渲染新增的元素
            renderElementItems(additionalElements);
            
            // 如果已显示所有元素，隐藏"加载更多"按钮
            if (displayedElements.length >= currentElements.length) {
                document.getElementById('load-more-btn').style.display = 'none';
            }
        }
    </script>
</body>
</html>
