    <title>数据生成 - 训练数据生成系统</title>

    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Bootstrap图标 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        /* 自定义容器宽度 */
        .container {
            width: 90% !important;
            max-width: 90% !important;
        }
        
        /* 问答表格样式 */
        #tableView table {
            border-collapse: collapse;
            width: 100%;
        }
        
        #tableView th {
            background-color: #f5f5f5;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        #tableView td.bg-light {
            padding: 8px;
            background-color: #f0f8ff !important; /* 浅蓝色背景 */
            font-weight: 500;
        }
        
        #tableView td.text-success {
            padding: 8px;
            background-color: #f0fff0 !important; /* 浅绿色背景 */
        }
        
        .answer-container {
            max-height: 150px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .answer-container .badge {
            margin: 2px;
            display: inline-block;
        }
    </style>
</head>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/static/index.html">训练数据生成系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">

                        <a class="nav-link" href="/static/index.html"><i class="bi bi-house-door"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/dictionary.html"><i class="bi bi-journal-text"></i> 字典浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/static/data_generator.html"><i class="bi bi-gear"></i> 数据生成</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/about.html"><i class="bi bi-info-circle"></i> 关于系统</a>

    </nav>

    <!-- 主要内容 -->
    <div class="container main-container">
        <div class="row mb-4">
            <div class="col-md-12 text-center page-title">
                <h1 class="display-4 mb-3">训练数据生成工具</h1>
                <p class="lead">根据规则生成训练数据，支持多种业务场景</p>
            </div>
        </div>

        <!-- 生成选项 -->
        <div class="row">
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">生成设置</h5>
                    </div>
                    <div class="card-body">
                        <form id="generatorForm">
                            <div class="mb-3">
                                <label for="businessType" class="form-label">业务类型</label>
                                <select class="form-select" id="businessType">
                                    <option value="">请选择业务类型</option>
                                    <option value="searchStaff">员工查询</option>
                                    <option value="updateStaff">员工更新</option>
                                    <option value="searchCargo">货物查询</option>
                                    <option value="updateCargo">货物更新</option>
                                    <option value="searchPo">订单查询</option>
                                    <option value="searchContract">合同查询</option>
                                    <option value="summaryPo">订单统计</option>
                                    <option value="summaryCargo">货单统计</option>
                                    <option value="updateContract">合同更新</option>
                                    <option value="submitvpopo">VPO预结算提交</option>
                                    <option value="submitvposent">VPO货单结算提交</option>
                                    <option value="vpocontractclone">VPO合同单价克隆</option>
                                    <option value="searchvpopo">VPO预结算查询</option>
                                    <option value="searchvposent">VPO货单结算查询</option>
                                    <option value="searchvpocontract">VPO合同查询</option>
                                    <option value="searchvpopofrom">VPO订单查询(from)</option>
                                    <option value="searchvposentfrom">VPO货单查询(from)</option>
                                </select>
                            </div>
                            <!-- 生成数量改为隐藏字段，默认200 -->
                            <input type="hidden" id="dataCount" value="200">
                            <div class="mb-3">
                                <label for="dataVariation" class="form-label">数据变化程度</label>
                                <input type="number" class="form-control" id="dataVariation" value="5">
                                <div class="form-text">数值越大变化越多</div>
                            </div>
                            <div class="mb-3">
                                <label for="ruleIds" class="form-label">规则IDs</label>
                                <input type="text" class="form-control" id="ruleIds" placeholder="规则ID，多个用逗号分隔">
                            </div>
                            <div class="mb-3">
                                <label for="keyword" class="form-label">关键字过滤</label>
                                <input type="text" class="form-control" id="keyword" placeholder="关键字，多个用逗号分隔">
                            </div>
                            <div class="mb-3">
                                <label for="previewCount" class="form-label">预览数量</label>
                                <input type="number" class="form-control" id="previewCount" value="50" min="1">
                                <div class="form-text">显示在结果区域的数据条数</div>
                            </div>
                            <button type="button" class="btn btn-primary w-100" id="generateBtn">
                                <i class="bi bi-lightning-charge"></i> 生成数据
                            </button>
                        </form>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">导出</h5>
                    </div>
                    <div class="card-body">
                        <button type="button" class="btn btn-info w-100 mb-3" id="exportBtn" disabled>
                            <i class="bi bi-download"></i> 导出为JSON (Raw+Qwen)
                        </button>
                        
                        <div class="mb-3">
                            <label for="serverFilePrefix" class="form-label">服务器文件前缀</label>
                            <input type="text" class="form-control" id="serverFilePrefix" value="export" placeholder="输入文件前缀">
                            <div class="form-text">保存到服务器时的文件前缀</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="evaluationPercentage" class="form-label">评估数据百分比</label>
                            <input type="number" class="form-control" id="evaluationPercentage" value="10" min="1" max="100">
                            <div class="form-text">从生成数据中随机抽取的百分比（1-100）</div>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="uploadToAlistSwitch">
                            <label class="form-check-label" for="uploadToAlistSwitch">上传到云端 (Alist)</label>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="enableBusinessAnalysisSwitch">
                            <label class="form-check-label" for="enableBusinessAnalysisSwitch">启用业务意图解析</label>
                        </div>

                        <button type="button" class="btn btn-success w-100" id="saveToServerBtn" disabled>
                            <i class="bi bi-cloud-upload"></i> 保存到服务器
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-9">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">生成结果</h5>
                        <div>
                            <button class="btn btn-sm btn-outline-secondary me-2" id="copyBtn" disabled>
                                <i class="bi bi-clipboard"></i> 复制
                            </button>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-secondary" id="viewJsonBtn">JSON</button>
                                <button class="btn btn-sm btn-outline-secondary active" id="viewTableBtn">表格</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="jsonView" style="display:none;">
                            <pre id="generatedData" class="bg-light p-3 rounded" style="max-height: 500px; overflow-y: auto;">// 生成的数据将显示在这里</pre>
                        </div>
                        <div id="tableView" style="max-height: 500px; overflow-y: auto;">
                            <table class="table table-striped table-bordered">
                                <thead id="resultTableHead">
                                    <tr>
                                        <th>序号</th>
                                        <th>问答</th>
                                        <th>规则名称</th>
                                        <th>规则ID</th>
                                        <th>规则代码</th>
                                        <th>规则排序</th>
                                    </tr>
                                </thead>
                                <tbody id="resultTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center">尚未生成数据</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">生成日志</h5>
                    </div>
                    <div class="card-body">
                        <div id="generationLog" class="bg-dark text-light p-3 rounded" style="height: 150px; overflow-y: auto; font-family: monospace;">
                            系统初始化完成，等待生成数据...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2023 训练数据生成系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- Bootstrap JS 和 Popper.js -->
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- 页面脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const businessTypeSelect = document.getElementById('businessType');
            const dataCountInput = document.getElementById('dataCount');
            const dataVariationInput = document.getElementById('dataVariation');
            const ruleIdsInput = document.getElementById('ruleIds');
            const keywordInput = document.getElementById('keyword');
            const previewCountInput = document.getElementById('previewCount');
            const generateBtn = document.getElementById('generateBtn');
            const exportBtn = document.getElementById('exportBtn');
            const copyBtn = document.getElementById('copyBtn');
            const viewJsonBtn = document.getElementById('viewJsonBtn');
            const viewTableBtn = document.getElementById('viewTableBtn');
            const jsonView = document.getElementById('jsonView');
            const tableView = document.getElementById('tableView');
            const generatedDataPre = document.getElementById('generatedData');
            const resultTableHead = document.getElementById('resultTableHead');
            const resultTableBody = document.getElementById('resultTableBody');
            const generationLog = document.getElementById('generationLog');
            const serverFilePrefixInput = document.getElementById('serverFilePrefix');
            const evaluationPercentageInput = document.getElementById('evaluationPercentage');
            const saveToServerBtn = document.getElementById('saveToServerBtn');
            const uploadToAlistSwitch = document.getElementById('uploadToAlistSwitch');
            const enableBusinessAnalysisSwitch = document.getElementById('enableBusinessAnalysisSwitch');

            // 存储生成的数据
            let generatedData = null;
            
            // 视图切换
            viewJsonBtn.addEventListener('click', function() {
                viewJsonBtn.classList.add('active');
                viewTableBtn.classList.remove('active');
                jsonView.style.display = 'block';
                tableView.style.display = 'none';
            });
            
            viewTableBtn.addEventListener('click', function() {
                viewTableBtn.classList.add('active');
                viewJsonBtn.classList.remove('active');
                tableView.style.display = 'block';
                jsonView.style.display = 'none';
            });
            
            // 生成数据
            generateBtn.addEventListener('click', function() {
                const businessType = businessTypeSelect.value;
                const dataCount = parseInt(dataCountInput.value);
                const dataVariation = parseInt(dataVariationInput.value);
                const ruleIds = ruleIdsInput.value.trim();
                const keyword = keywordInput.value.trim();
                const previewCount = parseInt(previewCountInput.value);
                
                if (!businessType) {
                    addLog('错误: 请选择业务类型', 'error');
                    return;
                }
                
                // 构建请求参数
                const requestData = {
                    count: dataCount,
                    variation: dataVariation,
                    previewCount: previewCount
                };
                
                // 如果提供了规则IDs，则添加到请求中
                if (ruleIds) {
                    requestData.ruleIds = ruleIds.split(',').map(id => id.trim());
                }
                
                // 如果提供了关键字，则添加到请求中
                if (keyword) {
                    requestData.keyword = keyword;
                }
                
                addLog(`开始生成数据: 类型=${businessType}, 数量=${dataCount}, 变化程度=${dataVariation}${ruleIds ? ', 规则IDs=' + ruleIds : ''}${keyword ? ', 关键字=' + keyword : ''}`);
                
                // 发送请求生成数据
                fetch(`/api/generate/${businessType}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`服务器错误: ${response.status}`);
                    }
                    return response.json();
                })
                .then(response => {
                    // 检查响应是否包含data和stats属性
                    let data;
                    if (response.data && response.stats) {
                        // 新版API格式，包含stats属性
                        data = response.data;
                        
                        // 确保每条记录都有formatted_question和formatted_answer字段
                        data.forEach(item => {
                            // 如果没有格式化问题，则使用问题字段或创建空字符串
                            if (!item.formatted_question) {
                                if (typeof item.question === 'object') {
                                    // 尝试使用对象的值拼接成字符串
                                    const questionValues = Object.values(item.question).filter(v => v);
                                    item.formatted_question = questionValues.join(' ');
                                } else if (typeof item.question === 'string') {
                                    item.formatted_question = item.question;
                                } else {
                                    item.formatted_question = '';
                                }
                            }
                            
                            // 如果没有格式化答案，则使用答案字段或创建空字符串
                            if (!item.formatted_answer) {
                                if (typeof item.answer === 'object') {
                                    // 将对象转换为JSON字符串
                                    item.formatted_answer = JSON.stringify(item.answer, null, 2);
                                } else if (typeof item.answer === 'string') {
                                    item.formatted_answer = item.answer;
                                } else {
                                    item.formatted_answer = '';
                                }
                            }
                        });
                        
                        generatedData = data;
                        displayData(data);
                        
                        // 显示统计信息
                        addLog(`成功生成${response.stats.returned}条数据（共生成${response.stats.total_generated}条）`);
                        addLog(`规则分布: ${response.stats.rule_distribution}`);
                    } else {
                        // 旧版API格式，直接返回数据
                        data = response;
                        
                        // 确保每条记录都有formatted_question和formatted_answer字段
                        data.forEach(item => {
                            // 如果没有格式化问题，则使用问题字段或创建空字符串
                            if (!item.formatted_question) {
                                if (typeof item.question === 'object') {
                                    // 尝试使用对象的值拼接成字符串
                                    const questionValues = Object.values(item.question).filter(v => v);
                                    item.formatted_question = questionValues.join(' ');
                                } else if (typeof item.question === 'string') {
                                    item.formatted_question = item.question;
                                } else {
                                    item.formatted_question = '';
                                }
                            }
                            
                            // 如果没有格式化答案，则使用答案字段或创建空字符串
                            if (!item.formatted_answer) {
                                if (typeof item.answer === 'object') {
                                    // 将对象转换为JSON字符串
                                    item.formatted_answer = JSON.stringify(item.answer, null, 2);
                                } else if (typeof item.answer === 'string') {
                                    item.formatted_answer = item.answer;
                                } else {
                                    item.formatted_answer = '';
                                }
                            }
                        });
                        
                        generatedData = data;
                        displayData(data);
                        addLog(`成功生成${data.length}条数据`);
                    }
                    
                    // 启用按钮
                    exportBtn.disabled = false;
                    copyBtn.disabled = false;
                    saveToServerBtn.disabled = false;
                })
                .catch(error => {
                    addLog(`生成失败: ${error.message}`, 'error');
                    console.error('生成数据错误:', error);
                });
            });
            
            // 复制按钮
            copyBtn.addEventListener('click', function() {
                if (!generatedData) return;
                
                const dataStr = JSON.stringify(generatedData, null, 2);
                navigator.clipboard.writeText(dataStr).then(function() {
                    addLog('数据已复制到剪贴板');
                }, function() {
                    addLog('复制失败，请手动复制', 'error');
                });
            });
            
            // 导出按钮 - 同时导出raw数据和qwen格式数据
            exportBtn.addEventListener('click', function() {
                if (!generatedData) return;
                
                // 生成时间戳，用于文件名
                const timestamp = new Date().toISOString().replace(/[:.]/g, '_').slice(0, 19);
                const businessType = businessTypeSelect.value;
                
                // 1. 准备raw数据 - 原始格式
                const rawData = generatedData.map(item => {
                    return {
                        "business_object": businessType,
                        "rule_id": item.rule_id || '',
                        "rule_name": item.rule_name || '',
                        "question": item.question || {},
                        "answer": item.answer || {},
                        "codebase": item.codebase || '',
                        "formatted_question": item.formatted_question || '',
                        "formatted_answer": item.formatted_answer || '',
                        "combo_value": item.combo_value || `${businessType}_${item.rule_id || ''}`
                    };
                });
                
                // 2. 准备qwen数据 - 对话格式
                const qwenData = generatedData.map(item => {
                    return {
                        "messages": [
                            {
                                "role": "user",
                                "content": item.formatted_question || ''
                            },
                            {
                                "role": "assistant",
                                "content": item.formatted_answer || ''
                            }
                        ]
                    };
                });
                
                // 3. 导出raw数据 - JSONL格式
                let rawDataLines = '';
                rawData.forEach(item => {
                    rawDataLines += JSON.stringify(item) + '\n';
                });
                const rawDataBlob = new Blob([rawDataLines], {type: 'application/jsonl'});
                const rawUrl = URL.createObjectURL(rawDataBlob);
                
                const rawLink = document.createElement('a');
                rawLink.href = rawUrl;
                rawLink.download = `raw_data_${businessType}_${timestamp}.jsonl`;
                document.body.appendChild(rawLink);
                rawLink.click();
                
                setTimeout(function() {
                    document.body.removeChild(rawLink);
                    window.URL.revokeObjectURL(rawUrl);  
                }, 100);
                
                // 4. 导出qwen数据 - JSONL格式
                let qwenDataLines = '';
                qwenData.forEach(item => {
                    qwenDataLines += JSON.stringify(item) + '\n';
                });
                const qwenDataBlob = new Blob([qwenDataLines], {type: 'application/jsonl'});
                const qwenUrl = URL.createObjectURL(qwenDataBlob);
                
                const qwenLink = document.createElement('a');
                qwenLink.href = qwenUrl;
                qwenLink.download = `qwen_data_${businessType}_${timestamp}.jsonl`;
                document.body.appendChild(qwenLink);
                
                // 延迟一点时间再触发第二次下载，避免浏览器阻止
                setTimeout(function() {
                    qwenLink.click();
                    document.body.removeChild(qwenLink);
                    window.URL.revokeObjectURL(qwenUrl);
                    addLog(`数据已导出为两个JSONL文件：raw_data_${businessType}_${timestamp}.jsonl 和 qwen_data_${businessType}_${timestamp}.jsonl`);
                }, 300);
            });
            
            // 保存到服务器按钮
            saveToServerBtn.addEventListener('click', function() {
                if (!generatedData) return;
                
                const businessType = businessTypeSelect.value;
                const prefix = serverFilePrefixInput.value.trim() || 'export';
                const percentage = parseInt(evaluationPercentageInput.value) || 10;
                const uploadToAlist = uploadToAlistSwitch.checked;
                const keyword = keywordInput.value.trim();
                const enableBusinessAnalysis = enableBusinessAnalysisSwitch.checked;
                
                // 验证百分比范围
                if (percentage < 1 || percentage > 100) {
                    addLog('错误: 评估数据百分比必须在1-100之间', 'error');
                    return;
                }
                
                // 禁用按钮并显示加载状态
                saveToServerBtn.disabled = true;
                const originalText = saveToServerBtn.innerHTML;
                saveToServerBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> 保存中...';
                
                const logMessage = `开始生成并保存数据到服务器，数量: ${parseInt(dataCountInput.value)}条，文件前缀: ${prefix}，评估数据比例: ${percentage}%` +
                                   (keyword ? `，关键字: ${keyword}` : '') +
                                   (uploadToAlist ? '，并上传到Alist' : '') +
                                   (enableBusinessAnalysis ? '，启用业务意图解析' : '');
                addLog(logMessage);
                
                // 发送请求生成并保存数据
                fetch(`/api/save-generated/${businessType}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        count: parseInt(dataCountInput.value),
                        variation: parseInt(dataVariationInput.value),
                        ruleIds: ruleIdsInput.value.trim() ? ruleIdsInput.value.trim().split(',').map(id => id.trim()) : null,
                        prefix: prefix,
                        evaluation_percentage: percentage,
                        upload_to_alist: uploadToAlist,
                        keyword: keyword || null,
                        enable_business_analysis: enableBusinessAnalysis
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`服务器错误: ${response.status}`);
                    }
                    return response.json();
                })
                .then(result => {
                    addLog(`✓ ${result.message}`);
                    addLog(`✓ 保存目录: ${result.directory}`);
                    addLog(`✓ 生成数据: ${result.generated_count}条，实际使用: ${result.original_count}条`);
                    addLog(`✓ 抽样比例: ${result.evaluation_percentage}%`);
                    addLog(`✓ Raw数据文件: ${result.files.raw_file} (${result.raw_count}条)`);
                    addLog(`✓ Qwen数据文件: ${result.files.qwen_file} (${result.qwen_count}条)`);

                    // 添加业务意图解析文件信息
                    if (result.files.business_analysis_file) {
                        addLog(`✓ 业务意图解析文件: ${result.files.business_analysis_file} (${result.business_analysis_count}条)`);
                    }

                    // 处理alist上传响应
                    if (result.alist_upload) {
                        if (result.alist_upload.status === 'success') {
                            addLog(`✓ Alist上传成功`);
                            addLog(`  Raw文件URL: <a href="${result.alist_upload.raw_file_url}" target="_blank" class="text-white-50">${result.alist_upload.raw_file_url}</a>`);
                            addLog(`  Qwen文件URL: <a href="${result.alist_upload.qwen_file_url}" target="_blank" class="text-white-50">${result.alist_upload.qwen_file_url}</a>`);

                            // 添加业务意图解析文件URL
                            if (result.alist_upload.business_analysis_file_url) {
                                addLog(`  业务意图解析文件URL: <a href="${result.alist_upload.business_analysis_file_url}" target="_blank" class="text-white-50">${result.alist_upload.business_analysis_file_url}</a>`);
                            }
                        } else {
                            addLog(`✗ Alist上传失败: ${result.alist_upload.error}`, 'error');
                        }
                    }
                })
                .catch(error => {
                    addLog(`保存失败: ${error.message}`, 'error');
                    console.error('保存到服务器错误:', error);
                })
                .finally(() => {
                    // 恢复按钮状态
                    saveToServerBtn.disabled = false;
                    saveToServerBtn.innerHTML = originalText;
                });
            });
            
            // 根据规则分布平均抽取数据
            function getBalancedSampleByRule(data, targetCount) {
                if (!data || data.length === 0) return [];
                
                // 按规则ID分组
                const ruleGroups = {};
                data.forEach(item => {
                    const ruleId = item.rule_id || 'unknown';
                    if (!ruleGroups[ruleId]) {
                        ruleGroups[ruleId] = [];
                    }
                    ruleGroups[ruleId].push(item);
                });
                
                // 获取规则类型数量
                const ruleCount = Object.keys(ruleGroups).length;
                if (ruleCount === 0) return data.slice(0, targetCount);
                
                // 计算每种规则应该抽取的数量（平均分配）
                const samplesPerRule = Math.floor(targetCount / ruleCount);
                const remainingSamples = targetCount % ruleCount;
                
                // 从每种规则中抽取数据
                const sampledData = [];
                const ruleIds = Object.keys(ruleGroups);
                
                ruleIds.forEach((ruleId, index) => {
                    const ruleData = ruleGroups[ruleId];
                    // 前几个规则多分配一个样本（处理余数）
                    const sampleCount = samplesPerRule + (index < remainingSamples ? 1 : 0);
                    
                    // 如果该规则的数据不足，全部使用
                    if (ruleData.length <= sampleCount) {
                        sampledData.push(...ruleData);
                    } else {
                        // 随机抽取指定数量的样本
                        const shuffled = [...ruleData].sort(() => 0.5 - Math.random());
                        sampledData.push(...shuffled.slice(0, sampleCount));
                    }
                });
                
                // 如果抽取的数据不足目标数量，补充剩余数据
                if (sampledData.length < targetCount) {
                    const remainingData = data.filter(item => 
                        !sampledData.some(sampled => sampled === item)
                    );
                    const needed = targetCount - sampledData.length;
                    sampledData.push(...remainingData.slice(0, needed));
                }
                
                return sampledData.slice(0, targetCount);
            }
            
            // 显示数据
            function displayData(data) {
                // 获取预览数量
                const previewCount = parseInt(previewCountInput.value) || 50;
                
                // 按规则分布平均抽取数据
                const displayData = getBalancedSampleByRule(data, previewCount);
                
                // JSON视图
                generatedDataPre.textContent = JSON.stringify(displayData, null, 2);
                
                // 表格视图
                if (displayData && displayData.length > 0) {
                    // 创建表头 - 使用新的表头格式
                    let headerHtml = '<tr>' +
                        '<th style="width:5%">序号</th>' +
                        '<th style="width:40%">问答</th>' +
                        '<th style="width:20%">规则名称</th>' +
                        '<th style="width:10%">规则ID</th>' +
                        '<th style="width:15%">规则代码</th>' +
                        '<th style="width:10%">规则排序</th>' +
                        '</tr>';
                    resultTableHead.innerHTML = headerHtml;
                    
                    // 创建表体 - 使用新的表格内容格式
                    let bodyHtml = '';
                    displayData.forEach((item, index) => {
                        // 获取必要的字段，如果不存在则使用默认值
                        const formattedQuestion = item.formatted_question || '无问题';
                        
                        // 处理答案 - 如果是JSON字符串，则转换为更可读的格式
                        let formattedAnswer = item.formatted_answer || '无答案';
                        try {
                            // 尝试解析JSON字符串
                            if (typeof formattedAnswer === 'string' && formattedAnswer.trim().startsWith('{')) {
                                const answerObj = JSON.parse(formattedAnswer);
                                // 将JSON对象转换为更可读的格式
                                formattedAnswer = '<div class="answer-container">';
                                for (const [key, value] of Object.entries(answerObj)) {
                                    if (value && value !== '无') {
                                        let displayValue = '';

                                        // 处理不同类型的值
                                        if (Array.isArray(value)) {
                                            // 处理数组类型
                                            if (value.length > 0) {
                                                if (typeof value[0] === 'object') {
                                                    // 对象数组，提取有意义的信息
                                                    displayValue = value.map(item => {
                                                        if (item.name && item.code) {
                                                            return `${item.name}(${item.code})`;
                                                        } else if (item.name) {
                                                            return item.name;
                                                        } else {
                                                            return JSON.stringify(item);
                                                        }
                                                    }).join(', ');
                                                } else {
                                                    // 简单数组
                                                    displayValue = value.join(', ');
                                                }
                                            }
                                        } else if (typeof value === 'object') {
                                            // 处理对象类型
                                            displayValue = JSON.stringify(value);
                                        } else {
                                            // 处理基本类型
                                            displayValue = value;
                                        }

                                        if (displayValue) {
                                            formattedAnswer += `<span class="badge bg-secondary me-1">${key}:${displayValue}</span>`;
                                        }
                                    }
                                }
                                formattedAnswer += '</div>';
                            }
                        } catch (e) {
                            // 解析失败则使用原始字符串
                            console.log('解析答案JSON失败:', e);
                        }
                        
                        const ruleName = item.rule_name || '未知规则';
                        const ruleId = item.rule_id || 'N/A';
                        const codebase = item.codebase || '';
                        const comboValue = item.combo_value || '';
                        
                        // 构建表格行
                        bodyHtml += 
                            `<tr>
                                <td rowspan="2" class="align-middle">${index + 1}</td>
                                <td class="bg-light">${formattedQuestion}</td>
                                <td rowspan="2" class="align-middle">${ruleName}</td>
                                <td rowspan="2" class="align-middle">${ruleId}</td>
                                <td rowspan="2" class="align-middle">${codebase}</td>
                                <td rowspan="2" class="align-middle">${comboValue}</td>
                            </tr>
                            <tr>
                                <td class="text-success">${formattedAnswer}</td>
                            </tr>`;
                    });
                    resultTableBody.innerHTML = bodyHtml;
                    
                    // 显示预览信息 
                    if (data.length > previewCount) {
                        // 统计规则分布
                        const ruleGroups = {};
                        data.forEach(item => {
                            const ruleId = item.rule_id || 'unknown';
                            if (!ruleGroups[ruleId]) ruleGroups[ruleId] = 0;
                            ruleGroups[ruleId]++;
                        });
                        const ruleCount = Object.keys(ruleGroups).length;
                        
                        addLog(`注意: 实际生成了${data.length}条数据，按${ruleCount}种规则平均抽取显示${previewCount}条`);
                        addLog(`规则分布: ${Object.entries(ruleGroups).map(([id, count]) => `规则${id}(${count}条)`).join(', ')}`);
                    }
                } else {
                    resultTableHead.innerHTML = '<tr><th>序号</th><th>问答</th><th>规则名称</th><th>规则ID</th><th>规则代码</th><th>规则排序</th></tr>';
                    resultTableBody.innerHTML = '<tr><td colspan="6" class="text-center">无数据</td></tr>';
                }
            }
            
            // 添加日志
            function addLog(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logClass = type === 'error' ? 'text-danger' : 'text-light';
                const logEntry = document.createElement('div');
                logEntry.className = logClass;
                logEntry.innerHTML = `[${timestamp}] ${message}`;
                
                generationLog.appendChild(logEntry);
                generationLog.scrollTop = generationLog.scrollHeight;
            }
            
            // 初始化
            addLog('系统初始化完成，等待操作...');
        });
        
        // 模拟数据生成（用于开发/测试）
    </script>
</body>
