<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 蓝色渐变背景 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- 白色图标组 -->
  <g transform="translate(512, 512)">
    <!-- DWG文件 (左侧) -->
    <g transform="translate(-280, -150)">
      <rect x="0" y="0" width="200" height="280" rx="15" fill="none" stroke="white" stroke-width="12"/>
      <path d="M 200 0 L 200 50 L 250 50 Z" fill="white" opacity="0.3"/>

      <!-- CAD网格 -->
      <g opacity="0.8">
        <line x1="30" y1="60" x2="170" y2="60" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
        <line x1="30" y1="100" x2="170" y2="100" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
        <line x1="30" y1="140" x2="170" y2="140" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
        <line x1="50" y1="40" x2="50" y2="180" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
        <line x1="100" y1="40" x2="100" y2="180" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
        <line x1="150" y1="40" x2="150" y2="180" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
      </g>

      <!-- DWG文字 -->
      <text x="100" y="250" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">DWG</text>
    </g>

    <!-- 转换箭头 -->
    <g transform="translate(0, -20)">
      <path d="M -60 0 L 60 0 L 60 -30 L 110 30 L 60 90 L 60 60 L -60 60 Z" fill="#10b981" stroke="#059669" stroke-width="8"/>
    </g>

    <!-- PDF文件 (右侧) -->
    <g transform="translate(80, -150)">
      <rect x="0" y="0" width="200" height="280" rx="15" fill="none" stroke="white" stroke-width="12"/>
      <path d="M 200 0 L 200 50 L 250 50 Z" fill="white" opacity="0.3"/>

      <!-- PDF线条 -->
      <g opacity="0.8">
        <line x1="30" y1="70" x2="170" y2="70" stroke="white" stroke-width="6"/>
        <line x1="30" y1="100" x2="170" y2="100" stroke="white" stroke-width="6"/>
        <line x1="30" y1="130" x2="170" y2="130" stroke="white" stroke-width="6"/>
        <line x1="30" y1="160" x2="130" y2="160" stroke="white" stroke-width="6"/>
      </g>

      <!-- PDF文字 -->
      <text x="100" y="250" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
    </g>
  </g>
</svg>
