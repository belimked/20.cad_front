[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-drawing-processor"
version = "0.1.0"
description = "CLI utilities to convert DWG files to DXF and split DXF by rectangular frames."
authors = [{ name = "Saul", email = "saul@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ezdxf>=1.2",
    "shapely>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cad-dxftool = "caddxftool.cli:run"
