[package]
name = "cad-pdf-converter"
version = "0.1.0"
description = "CAD 文件转 PDF 桌面应用"
authors = ["Your Name"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-hide", "http-request", "fs-remove-file", "window-unminimize", "window-unmaximize", "window-start-dragging", "window-minimize", "fs-read-file", "window-show", "window-maximize", "dialog-open", "window-close", "dialog-save", "fs-write-file", "fs-create-dir", "shell-open", "notification-all"] }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
